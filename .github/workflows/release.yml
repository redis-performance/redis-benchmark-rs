name: release

# Tag a release: `git tag v0.1.0 && git push --tags`
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 1) Universal static musl binary — runs on RHEL8/9, Ubuntu 22.04/24.04, anything.
  musl-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: make build-musl
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: redis-benchmark-rs-x86_64-musl

  # 2) Native per-distro packages (el8, el9, jammy, noble) — mirrors the memtier artifact set.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: rockylinux:8, kind: rpm, dist: el8 }
          - { image: rockylinux:9, kind: rpm, dist: el9 }
          - { image: "ubuntu:22.04", kind: deb, dist: jammy }
          - { image: "ubuntu:24.04", kind: deb, dist: noble }
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap toolchain
        shell: bash
        run: |
          set -e
          if command -v yum >/dev/null; then
            # --allowerasing: Rocky 9 ships curl-minimal which conflicts with curl
            yum install -y --allowerasing gcc make curl
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y gcc make curl ca-certificates
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build + package
        run: make ${{ matrix.kind }} DIST=${{ matrix.dist }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
